# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: secondcharge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_WEB_URL
        fromService:
          type: web
          name: secondcharge-web
          property: host
      - key: ANTHROPIC_API_KEY
        sync: false # optional: turns on Claude invoice reading and summaries
      - key: N8N_WEBHOOK_URL
        sync: false # optional
      - key: SEED_DEMO
        value: "1"
  - type: web
    name: secondcharge-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: secondcharge-api
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: secondcharge-api
          property: host
