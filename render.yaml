# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: secondcharge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_WEB_URL
        sync: false # your Vercel URL, e.g. https://secondcharge.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false # optional: turns on Claude invoice reading and summaries
      - key: N8N_WEBHOOK_URL
        sync: false # optional
      - key: SEED_DEMO
        value: "1"
